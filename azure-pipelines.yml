# =====================================================================
# ShackPulse — CI/CD to AKS (dev + prod namespaces)
#
#   CI  ─►  Build & scan images  ─►  Deploy DEV  ─►  (approval)  ─►  Deploy PROD
#
# The only values you may need to change are in the variables block below.
# Secrets come from the "shackpulse-keyvault" variable group (linked to Azure Key Vault).
# =====================================================================

trigger:
  branches:
    include: [main]
  paths:
    exclude: ['docs/*', '*.md']

pr:
  branches:
    include: [main]

parameters:
  - name: useSelfHostedAgent
    displayName: Run on the self-hosted agent pool (untick to use Microsoft-hosted ubuntu-latest)
    type: boolean
    default: true
  - name: selfHostedPool
    displayName: Self-hosted agent pool name
    type: string
    default: Agent-1

variables:
  - group: shackpulse-keyvault          # Key Vault secrets: dev-/prod- db-password, jwt-secret, admin-password
  # ---- Azure resources (must match infra/setup-azure.sh) ----
  - name: azureServiceConnection
    value: sc-shackpulse-azure          # Azure Resource Manager service connection (our service principal)
  - name: acrName
    value: acrdevopsshackpulse
  - name: acrLoginServer
    value: acrdevopsshackpulse.azurecr.io
  - name: aksResourceGroup
    value: rg-devopsshack-shackpulse
  - name: aksClusterName
    value: aks-devopsshack-shackpulse
  - name: appDomain
    value: prod-demo-99.site            # sites: shackpulse-dev.<appDomain> and shackpulse.<appDomain>
  # ---- Derived ----
  - name: imageTag
    value: $(Build.BuildId)             # unique per run, so every image traces back to the run that built it
  - name: nodeVersion
    value: 22.x
  - name: trivyVersion
    value: v0.58.1

stages:
  # -------------------------------------------------------------------
  # Stage 1 — CI: tests, lint, build, security checks (runs for PRs too)
  # -------------------------------------------------------------------
  - stage: CI
    displayName: CI — test & scan source
    pool:
      ${{ if eq(parameters.useSelfHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
      ${{ else }}:
        vmImage: ubuntu-latest
    jobs:
      - job: backend
        displayName: Backend tests (real PostgreSQL)
        services:
          postgres: postgres            # throwaway database defined in "resources" at the bottom
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)
          - script: npm ci
            workingDirectory: backend
            displayName: npm ci
          - script: npm run test:ci
            workingDirectory: backend
            displayName: Jest + Supertest (48 tests)
            env:
              DB_HOST: localhost
              DB_PORT: 5432
              DB_NAME: shackpulse_test
              DB_USER: shackpulse
              DB_PASSWORD: shackpulse
              JEST_JUNIT_OUTPUT_DIR: test-results
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: backend/test-results/*.xml
              testRunTitle: Backend
          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: backend/coverage/cobertura-coverage.xml

      - job: frontend
        displayName: Frontend lint, tests & build
        steps:
          - task: UseNode@1
            inputs:
              version: $(nodeVersion)
          - script: npm ci
            workingDirectory: frontend
            displayName: npm ci
          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint (oxlint)
          - script: npm run test:ci
            workingDirectory: frontend
            displayName: Vitest (18 tests)
          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: frontend/test-results/*.xml
              testRunTitle: Frontend
          - script: npm run build
            workingDirectory: frontend
            displayName: Production build

      - job: security
        displayName: Dependency, secret & IaC scan
        steps:
          - template: pipelines/templates/install-trivy.yml
          - script: |
              set -e
              (cd backend && npm audit --omit=dev --audit-level=critical)
              (cd frontend && npm audit --omit=dev --audit-level=critical)
            displayName: npm audit (fail on critical)
          - script: trivy fs --scanners vuln,secret --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed --skip-dirs node_modules .
            displayName: Trivy — vulnerabilities & leaked secrets (gate)
          - script: trivy config --severity HIGH,CRITICAL --exit-code 0 k8s/ backend/Dockerfile frontend/Dockerfile
            displayName: Trivy — Kubernetes & Dockerfile misconfig (report only)

  # -------------------------------------------------------------------
  # Stage 2 — Build, scan and push container images to ACR (never for PRs)
  # -------------------------------------------------------------------
  - stage: Build
    displayName: Build & push images
    dependsOn: CI
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    pool:
      ${{ if eq(parameters.useSelfHostedAgent, true) }}:
        name: ${{ parameters.selfHostedPool }}
      ${{ else }}:
        vmImage: ubuntu-latest
    jobs:
      - job: images
        displayName: Docker build → Trivy → ACR
        steps:
          - template: pipelines/templates/install-trivy.yml
          - task: AzureCLI@2
            displayName: Build, scan and push shackpulse-api / shackpulse-web
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az acr login --name $(acrName)
                for app in api web; do
                  dir=$([ "$app" = api ] && echo backend || echo frontend)
                  image=$(acrLoginServer)/shackpulse-$app
                  echo "##[section]Building $image:$(imageTag)"
                  docker build -t $image:$(imageTag) \
                    --label org.opencontainers.image.revision=$(Build.SourceVersion) \
                    --label org.opencontainers.image.source=$(Build.Repository.Uri) \
                    $dir
                  echo "##[section]Scanning $image:$(imageTag)"
                  trivy image --severity CRITICAL --exit-code 1 --ignore-unfixed --no-progress $image:$(imageTag)
                  docker push $image:$(imageTag)
                done
          - publish: k8s
            artifact: manifests
            displayName: Publish Kubernetes manifests

  # -------------------------------------------------------------------
  # Stage 3 — Deploy to the shackpulse-dev namespace
  # -------------------------------------------------------------------
  - stage: DeployDev
    displayName: Deploy → DEV
    dependsOn: Build
    condition: succeeded()
    jobs:
      - template: pipelines/templates/deploy-aks.yml
        parameters:
          environment: dev
          adoEnvironment: shackpulse-dev
          namespace: shackpulse-dev
          hostPrefix: shackpulse-dev
          useSelfHostedAgent: ${{ parameters.useSelfHostedAgent }}
          selfHostedPool: ${{ parameters.selfHostedPool }}

  # -------------------------------------------------------------------
  # Stage 4 — Deploy to the shackpulse-prod namespace. The approval check on the
  # "shackpulse-prod" environment pauses the run here until someone approves.
  # -------------------------------------------------------------------
  - stage: DeployProd
    displayName: Deploy → PROD
    dependsOn: DeployDev
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - template: pipelines/templates/deploy-aks.yml
        parameters:
          environment: prod
          adoEnvironment: shackpulse-prod
          namespace: shackpulse-prod
          hostPrefix: shackpulse
          useSelfHostedAgent: ${{ parameters.useSelfHostedAgent }}
          selfHostedPool: ${{ parameters.selfHostedPool }}

# Top-level section (a sibling of "stages", not part of stage 4). Defines the throwaway
# PostgreSQL container that the CI backend job starts with "services: postgres: postgres".
resources:
  containers:
    - container: postgres
      image: postgres:16-alpine
      ports:
        - 5432:5432
      env:
        POSTGRES_DB: shackpulse_test
        POSTGRES_USER: shackpulse
        POSTGRES_PASSWORD: shackpulse
