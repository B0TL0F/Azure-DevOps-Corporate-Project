# =====================================================================
# Platform layer: owned by the platform team, applied ONCE by infra/setup-azure.sh (not by the pipeline).
#
#   GatewayClass approuting-istio   AKS-managed (app routing add-on, Gateway API mode). We only use it.
#   Gateway      shackpulse-gateway the shared entry point: one public IP, the listeners, TLS
#   HTTPRoute    http-to-https      redirects every plain-HTTP request to HTTPS
#
# Each app environment brings its own HTTPRoute (k8s/base/httproute.yaml). A listener decides
# which namespaces may attach to it, so dev routes can never take over the prod hostname.
# __APP_DOMAIN__ is filled in by the setup script.
# =====================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: shackpulse-gateway
  labels:
    app.kubernetes.io/part-of: shackpulse
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shackpulse-gateway
  namespace: shackpulse-gateway
  annotations:
    # cert-manager reads this and creates one Certificate per HTTPS listener below.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: approuting-istio
  listeners:
    # Port 80: only the HTTP->HTTPS redirect and Let's Encrypt's domain check attach here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # https://shackpulse-dev.<domain>: only routes from the shackpulse-dev namespace may attach.
    - name: https-dev
      protocol: HTTPS
      port: 443
      hostname: shackpulse-dev.__APP_DOMAIN__
      tls:
        mode: Terminate
        certificateRefs:
          - name: shackpulse-dev-tls        # created by cert-manager in this namespace
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: shackpulse-dev
    # https://shackpulse.<domain>: only routes from the shackpulse-prod namespace may attach.
    - name: https-prod
      protocol: HTTPS
      port: 443
      hostname: shackpulse.__APP_DOMAIN__
      tls:
        mode: Terminate
        certificateRefs:
          - name: shackpulse-prod-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: shackpulse-prod
---
# Every plain-HTTP request gets a 301 to HTTPS. Let's Encrypt's checks still work: cert-manager's
# temporary route matches the exact /.well-known/acme-challenge/<token> path, which is more specific
# than "/" here, so Gateway API sends the check to cert-manager first.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https
  namespace: shackpulse-gateway
spec:
  parentRefs:
    - name: shackpulse-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
