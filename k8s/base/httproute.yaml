# App layer: owned by the app team, applied by the pipeline in each namespace.
# It attaches to ONE listener of the shared platform Gateway (sectionName) and says which
# hostname goes to which Service. The overlay sets the listener (https-dev / https-prod) and the host.
# No TLS here: certificates live on the Gateway, which the platform team owns.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shackpulse
spec:
  parentRefs:
    - name: shackpulse-gateway
      namespace: shackpulse-gateway     # the Gateway lives in another namespace: allowed by the listener's selector
      sectionName: placeholder          # https-dev or https-prod, set by the overlay
  hostnames:
    - placeholder.local                 # filled in by the pipeline (__APP_HOST__)
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shackpulse-web          # nginx in the web pod serves React and proxies /api to the API
          port: 80
