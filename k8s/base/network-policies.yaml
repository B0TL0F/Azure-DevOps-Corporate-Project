# Enforced when the cluster runs a network policy engine (we create AKS with Azure CNI powered by Cilium).
# Default: nothing can reach pods in this namespace unless a rule below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
# The shared Gateway's Envoy pods (namespace shackpulse-gateway) may reach the web pods.
# Let's Encrypt's temporary solver pods also run in shackpulse-gateway, so no extra rule is needed here.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shackpulse-web
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shackpulse-gateway
      ports:
        - port: 8080
---
# Only the web pods (same namespace) may call the API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: shackpulse-api
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: shackpulse-web
      ports:
        - port: 8080
