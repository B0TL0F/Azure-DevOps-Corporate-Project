# maxUnavailable (not minAvailable) so a single-replica dev deployment never blocks node drains or AKS upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shackpulse-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shackpulse-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shackpulse-web
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shackpulse-web
