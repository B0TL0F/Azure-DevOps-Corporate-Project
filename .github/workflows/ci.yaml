name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shackpulse_test
          POSTGRES_USER: shackpulse
          POSTGRES_PASSWORD: shackpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shackpulse -d shackpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:ci
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: Backend_Tests
          path: |
            backend/junit.xml
            backend/coverage/
          
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test:ci
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: Frontend_Tests
          path: frontend/test-results/

  Build:
    name: Image Build for ${{ matrix.context }}
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        context:
          - ./backend
          - ./frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Build Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
