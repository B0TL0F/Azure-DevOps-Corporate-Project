name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shackpulse_test
          POSTGRES_USER: shackpulse
          POSTGRES_PASSWORD: shackpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shackpulse -d shackpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test:ci
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: Backend_Tests
          path: |
            backend/junit.xml
            backend/coverage/
          
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Run lint
        run: npm run lint
      - name: Run tests
        run: npm run test:ci
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: Frontend_Tests
          path: frontend/test-results/

  Build:
    name: Image Build for ${{ matrix.context }}
    needs: [test-backend, test-frontend]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        context:
          - ./backend
          - ./frontend
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Build Docker images
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}

  push:
    name: Push ${{ matrix.image }}
    needs: Build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: ./backend
            image: shackpulse-api
          - context: ./frontend
            image: shackpulse-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to the container registry
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: az acr login --name "${ACR_LOGIN_SERVER%%.*}"
      - name: Build and push the image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ vars.ACR_LOGIN_SERVER }}/${{ matrix.image }}:${{ github.sha }}
