# Local full-stack run: docker compose up --build  →  http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shackpulse
      POSTGRES_USER: shackpulse
      POSTGRES_PASSWORD: shackpulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shackpulse -d shackpulse"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    image: shackpulse-api:local
    environment:
      APP_ENV: local
      DB_HOST: db
      DB_NAME: shackpulse
      DB_USER: shackpulse
      DB_PASSWORD: shackpulse
      JWT_SECRET: local-dev-secret-change-me
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    image: shackpulse-web:local
    environment:
      API_UPSTREAM: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:8080"

volumes:
  pgdata:
